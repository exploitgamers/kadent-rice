shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=1.0
alpha-mode=matching
blur=yes
# Fallback palette (Caelestia sequences override most of it at shell start;
# black/blue are re-pinned in ~/.config/caelestia/user-config.fish)
foreground=dce8e6
background=0a0f0f
regular0=7b8a88
regular1=ff8a8a
regular2=56e2c0
regular3=f2d98b
regular4=82c4ff
regular5=c3a6ff
regular6=83d8c9
regular7=cddcd3
bright0=a7b4b2
bright1=ffadad
bright2=8bedd9
bright3=fbe7ae
bright4=b0dcff
bright5=dbc6ff
bright6=b5f2e8
bright7=ffffff
selection-foreground=0a0f0f
selection-background=9bd0cc

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
